name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # WPF (net10.0-windows) only builds/publishes on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: CodeSnippet/CodeSnippet/CodeSnippet.csproj

      - name: Restore
        run: dotnet restore CodeSnippet/CodeSnippet/CodeSnippet.csproj

      - name: Build
        run: dotnet build CodeSnippet/CodeSnippet/CodeSnippet.csproj --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish CodeSnippet/CodeSnippet/CodeSnippet.csproj
          --configuration Release
          --no-restore
          --runtime win-x64
          --self-contained false
          --output publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeSnippet-${{ github.sha }}
          path: publish/

      - name: Zip release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath CodeSnippet-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          CodeSnippet-${{ github.ref_name }}.zip
          --title ${{ github.ref_name }}
          --generate-notes
